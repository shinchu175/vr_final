<!DOCTYPE html>
<html>
<head>
    <title>Login / Register</title>

    <style>
        body {
    margin: 0;
    height: 100vh;

    justify-content: center;
    align-items: center;

    background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
    font-family: 'Poppins', sans-serif;
}
header {
    width: 100%;
    padding: 30px 20px;
    text-align: center;

    background: #3b3e6b;  /* same dark background */
    color: white;         /* FIX: makes text white */

    font-size: 28px;
    font-weight: bold;
}

/* subtitle text */
header p {
    margin-top: 10px;
    font-size: 18px;
    color: rgba(255, 255, 255, 0.8);
}

/* FORM CARD */
form {
    background: rgba(255,255,255,0.15);
    backdrop-filter: blur(15px);
justify-content: center;   /* horizontal center */
    align-items: center;
    padding: 40px;
    border-radius: 20px;
    width: 320px;

    box-shadow: 0 10px 30px rgba(0,0,0,0.3);
    text-align: center;
}
input, textarea {
    padding: 12px 15px;
    margin: 10px 0;
    border-radius: 12px;
    background: rgba(255, 255, 255, 0.1);
    color: var(--text-primary);
    font-family: inherit;
    font-size: 1rem;
    transition: var(--transition);
    backdrop-filter: blur(10px);
}

/* HEADINGS */
form h2 {
    margin-bottom: 5px;
}

form h4 {
    margin-bottom: 20px;
    color: rgba(0,0,0,0.7);
}

/* INPUTS */
input {
    width: 100%;
    padding: 10px;
    margin: 10px 0;

    border: none;
    border-radius: 10px;
}
input, textarea {
    padding: 12px 15px;
    margin: 10px 0;
    border-radius: 12px;
    border: 1px solid rgba(255, 255, 255, 0.3);
    background: rgba(255, 255, 255, 0.1);
    color: var(--text-primary);
    font-family: inherit;
    font-size: 1rem;
    transition: var(--transition);
    backdrop-filter: blur(10px);
}
/* BUTTON */
button {
    width: 100%;
    padding: 12px;
    margin-top: 10px;

    border: none;
    border-radius: 20px;

    background: rgba(0,0,0,0.7);
    color: white;
    font-weight: bold;

    cursor: pointer;
}

button:hover {
    transform: scale(1.05);
}

/* LINK */
a {
    display: block;
    margin-top: 10px;
    text-decoration: none;
    font-weight: bold
}

/* ERROR */
.error {
    color: red;
}
form {
    background: rgba(255,255,255,0.15);
    backdrop-filter: blur(15px);

    padding: 40px;
    border-radius: 20px;
    width: 320px;

    box-shadow: 0 10px 30px rgba(0,0,0,0.3);
    text-align: center;

    margin: 60px auto;   /* 🔥 THIS centers the form */
}
h2 {
    display: block;
    font-size: 1.5em;
    margin-block-start: 0.83em;
    margin-block-end: 0.83em;
    margin-inline-start: 0px;
    margin-inline-end: 0px;
    font-weight: bold;
    unicode-bidi: isolate;
}
header, .header {
    color: white
    padding: 30px 20px;
    text-align: center;
    background: rgba(0, 0, 0, 0.5);
    backdrop-filter: blur(10px);
    border-bottom: 2px solid rgba(255, 255, 255, 0.1);
    box-shadow: var(--shadow-md);
}


    </style>
</head>
<body>
<header>
<h2>Login or Register</h2>
        <h4>(way to see the world🌍)</h4>
</header>

    <form method="POST">

        {% if error %}
            <p class="error">{{ error }}</p>
        {% endif %}

        <input type="text" name="username" placeholder="username" required>


        <input type="password" name="password" placeholder="password" required>

        <button type="submit" name="action" value="login">Login</button><br>
<a href="/register" style="color:black;">New user? Register here</a>
    </form>
</body>
</html>
